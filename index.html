<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Face Mesh Texture Mapping</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.js"></script>
<script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
}
canvas {
  display: block;
}
</style>

</head>

<body>

<script>

// Face Mesh Texture Mapping
// https://thecodingtrain.com/tracks/ml5js-beginners-guide/ml5/facemesh

let video;
let faceMesh;
let faces = [];
let triangles;
let uvCoords;
let img;

function preload() {

  // Initialize FaceMesh model
  faceMesh = ml5.faceMesh({ maxFaces: 1 });

  // Load texture image
  img = loadImage("Tatoo1.png");

}

function mousePressed() {

  console.log(faces);

  saveCanvas('face_texture_map', 'png');
  console.log("画布已保存为 face_texture_map.png");

}

function gotFaces(results) {

  faces = results;

}

function setup() {

  createCanvas(640, 480, WEBGL);

  video = createCapture(VIDEO);
  video.size(640,480);
  video.hide();

  // Start face detection
  faceMesh.detectStart(video, gotFaces);

  // Get mesh data
  triangles = faceMesh.getTriangles();
  uvCoords = faceMesh.getUVCoords();

}

function keyPressed() {

  if (key === 's' || key === 'S') {

    saveCanvas('face_texture_map', 'png');
    console.log("画布已保存为 face_texture_map.png");

  }

}

function draw() {

  translate(-width / 2, -height / 2);

  background(0);

  // show webcam
  image(video, 0, 0);

  if (faces.length > 0) {

    let face = faces[0];

    tint(5, 255, 255, 122);
    texture(img);

    textureMode(NORMAL);

    noStroke();

    beginShape(TRIANGLES);

    for (let i = 0; i < triangles.length; i++) {

      let tri = triangles[i];

      let [a, b, c] = tri;

      let pointA = face.keypoints[a];
      let pointB = face.keypoints[b];
      let pointC = face.keypoints[c];

      let uvA = uvCoords[a];
      let uvB = uvCoords[b];
      let uvC = uvCoords[c];

      vertex(pointA.x, pointA.y, uvA[0], uvA[1]);
      vertex(pointB.x, pointB.y, uvB[0], uvB[1]);
      vertex(pointC.x, pointC.y, uvC[0], uvC[1]);

    }

    endShape();

  }

}

</script>

</body>
</html>
