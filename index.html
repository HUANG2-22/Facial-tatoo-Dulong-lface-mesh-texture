<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>FaceMesh Dual View</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.js"></script>

<script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

<style>
body{
margin:0;
background:black;
font-family:sans-serif;
text-align:center;
color:white;
}

#container{
display:flex;
justify-content:center;
gap:20px;
margin-top:10px;
}

canvas{
border:2px solid white;
}

button{
margin:10px;
padding:10px 20px;
font-size:16px;
cursor:pointer;
}
</style>

</head>

<body>

<h2>Face Mesh Dual Display</h2>

<div>
<button onclick="saveLeft()">Save Tattoo</button>
<button onclick="saveRight()">Save Mesh</button>
</div>

<div id="container"></div>

<script>

let video;
let faceMesh;

let faces=[];
let triangles;
let uvCoords;

let img;

let canvasLeft;
let canvasRight;

function preload(){

faceMesh = ml5.faceMesh({
maxFaces:1,
flipped:true
});

img = loadImage("TATOO22.png");

}

function gotFaces(results){
faces=results;
}

function setup(){

let container=document.getElementById("container");

canvasLeft=createCanvas(640,480,WEBGL);
canvasLeft.parent(container);

canvasRight=createGraphics(640,480);

video=createCapture(VIDEO,{flipped:true});
video.size(640,480);
video.hide();

faceMesh.detectStart(video,gotFaces);

triangles=faceMesh.getTriangles();
uvCoords=faceMesh.getUVCoords();

}

function draw(){

// LEFT WINDOW (TATTOO)

push();

translate(-width/2,-height/2);

background(0);

image(video,0,0);

if(faces.length>0){

let face=faces[0];

tint(5,255,255,122);
texture(img);
textureMode(NORMAL);
noStroke();

beginShape(TRIANGLES);

for(let i=0;i<triangles.length;i++){

let tri=triangles[i];
let [a,b,c]=tri;

let pointA=face.keypoints[a];
let pointB=face.keypoints[b];
let pointC=face.keypoints[c];

let uvA=uvCoords[a];
let uvB=uvCoords[b];
let uvC=uvCoords[c];

vertex(pointA.x,pointA.y,uvA[0],uvA[1]);
vertex(pointB.x,pointB.y,uvB[0],uvB[1]);
vertex(pointC.x,pointC.y,uvC[0],uvC[1]);

}

endShape();

}

pop();


// RIGHT WINDOW (MESH)

canvasRight.background(0);

canvasRight.image(video,0,0);

if(faces.length>0){

let face=faces[0];

video.loadPixels();

canvasRight.randomSeed(5);

canvasRight.beginShape(TRIANGLES);

for(let i=0;i<triangles.length;i++){

let tri=triangles[i];
let [a,b,c]=tri;

let pointA=face.keypoints[a];
let pointB=face.keypoints[b];
let pointC=face.keypoints[c];

let cx=(pointA.x+pointB.x+pointC.x)/3;
let cy=(pointA.y+pointB.y+pointC.y)/3;

let index=(floor(cx)+floor(cy)*video.width)*4;

let rr=video.pixels[index];
let gg=video.pixels[index+1];
let bb=video.pixels[index+2];

canvasRight.stroke(rr,gg,bb);
canvasRight.fill(random(255),gg,bb);

canvasRight.vertex(pointA.x,pointA.y);
canvasRight.vertex(pointB.x,pointB.y);
canvasRight.vertex(pointC.x,pointC.y);

}

canvasRight.endShape();

}

image(canvasRight,width,0);

}

// SAVE BUTTONS

function saveLeft(){

saveCanvas(canvasLeft,'tattoo_face','png');

}

function saveRight(){

save(canvasRight,'mesh_face.png');

}

</script>

</body>
</html>
